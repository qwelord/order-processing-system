<div class="pig-easter-egg" id="pigEasterEgg" aria-label="Интерактивная свинья">
  <button class="pig-easter-egg__button" id="pigButton" type="button" aria-label="Нажать на свинью и услышать хрюканье" aria-describedby="pigCounter">
    <span class="pig-easter-egg__glow" aria-hidden="true"></span>
    <img class="pig-easter-egg__image" src="/pig-widget/pig.svg" alt="Свинья" draggable="false">
    <span class="pig-easter-egg__counter" id="pigCounter" aria-live="polite">Хрюков: 0</span>
  </button>
  <audio id="pigSound" preload="auto">
    <source src="/pig-widget/pig-oink.mp3" type="audio/mpeg">
  </audio>
</div>
