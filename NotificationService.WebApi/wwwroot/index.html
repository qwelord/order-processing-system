<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Processing System — Live Event Monitor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin: 0;
        }

        .status-badge {
            font-size: 13px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
        }

            .status-badge.connected {
                background-color: rgba(16, 185, 129, 0.1);
                color: var(--accent-green);
                border-color: rgba(16, 185, 129, 0.2);
            }

            .status-badge.disconnected {
                background-color: rgba(239, 68, 68, 0.1);
                color: var(--accent-red);
                border-color: rgba(239, 68, 68, 0.2);
            }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
        }

        .events-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px dashed var(--border-color);
            color: var(--text-secondary);
            font-size: 14px;
        }

        .event-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .event-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .event-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .event-value {
            font-size: 14px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: var(--text-primary);
        }

        .status-completed {
            color: var(--accent-green);
            font-weight: 600;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">SignalR Live Stream Monitor</h1>
            <div id="statusBadge" class="status-badge disconnected">
                <span class="status-dot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </div>

        <div id="eventsContainer" class="events-container">
            <div id="emptyState" class="empty-state">
                Awaiting incoming payment events from Kafka...
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
    <script>
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const eventsContainer = document.getElementById('eventsContainer');
        const emptyState = document.getElementById('emptyState');

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("http://localhost:5003/notifications")
            .withAutomaticReconnect()
            .build();

        connection.on("ReceivePaymentUpdate", (data) => {
            if (emptyState) {
                emptyState.style.display = 'none';
            }

            const card = document.createElement('div');
            card.className = 'event-card';

            const formattedAmount = new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB' }).format(data.amount);
            const formattedDate = new Date(data.timestamp).toLocaleTimeString('ru-RU');

            card.innerHTML = `
                    <div class="event-field">
                        <span class="event-label">Order ID</span>
                        <span class="event-value">${data.orderId}</span>
                    </div>
                    <div class="event-field">
                        <span class="event-label">Payment ID</span>
                        <span class="event-value">${data.paymentId}</span>
                    </div>
                    <div class="event-field">
                        <span class="event-label">Amount</span>
                        <span class="event-value">${formattedAmount}</span>
                    </div>
                    <div class="event-field">
                        <span class="event-label">Status / Time</span>
                        <span class="event-value status-completed">${data.status} (${formattedDate})</span>
                    </div>
                `;

            eventsContainer.prepend(card);
        });

        connection.start()
            .then(() => {
                statusBadge.className = "status-badge connected";
                statusText.textContent = "Connected";
            })
            .catch(err => {
                statusBadge.className = "status-badge disconnected";
                statusText.textContent = "Connection Error";
            });
    </script>
</body>
</html>
