version: '3.8'

services:
  postgres-orders:
    image: postgres:16-alpine
    container_name: postgres-orders
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_orders_data:/var/lib/postgresql/data

  postgres-payments:
    image: postgres:16-alpine
    container_name: postgres-payments
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_payments_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  order-service:
    build:
      context: .
      dockerfile: OrderService.WebApi/Dockerfile
    container_name: order-service
    ports:
      - "5001:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres-orders;Port=5432;Database=orders_db;Username=postgres;Password=postgres_password
      - PaymentService__BaseUrl=http://payment-service:80
    depends_on:
      - postgres-orders
      - payment-service

  payment-service:
    build:
      context: .
      dockerfile: PaymentService.WebApi/Dockerfile
    container_name: payment-service
    ports:
      - "5002:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres-payments;Port=5432;Database=payments_db;Username=postgres;Password=postgres_password
      - Kafka__BootstrapServers=kafka:29092
    depends_on:
      - postgres-payments
      - kafka

  notification-service:
    build:
      context: .
      dockerfile: NotificationService.WebApi/Dockerfile
    container_name: notification-service
    ports:
      - "5003:80"
    environment:
      - Kafka__BootstrapServers=kafka:29092
    depends_on:
      - kafka

volumes:
  postgres_orders_data:
  postgres_payments_data:
